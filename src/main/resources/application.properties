spring.application.name=espectrum

# Render (e a maioria dos PaaS) definem a porta via variavel de ambiente PORT
server.port=${PORT:8080}

invertexto.api.token=${INVERTEXTO_API_TOKEN}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Email agora vai pela API HTTP do Brevo (nao mais SMTP), porque o Render
# bloqueia conexoes de saida nas portas SMTP (25/465/587). Veja EmailServiceImpl.
# spring.mail.username aqui e reaproveitado como o remetente ("from") do
# email - precisa ser um endereco verificado como sender na sua conta Brevo.
brevo.api.key=${BREVO_API_KEY}
spring.mail.username=${MAIL_USERNAME}

suporte.destinatarios=${SUPORTE_DESTINATARIOS:espectrumsuporte@gmail.com}
