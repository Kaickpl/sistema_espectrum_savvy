spring.application.name=espectrum

# Render (e a maioria dos PaaS) definem a porta via variavel de ambiente PORT
server.port=${PORT:8080}

invertexto.api.token=${INVERTEXTO_API_TOKEN}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Host/porta configuraveis: por padrao usa Gmail (funciona local), mas em
# producao numa PaaS use um relay SMTP transacional (Brevo, SendGrid, etc.)
# via as variaveis MAIL_HOST/MAIL_PORT, porque conexao SMTP direta pro Gmail
# costuma dar timeout saindo de datacenters/nuvem.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

suporte.destinatarios=${SUPORTE_DESTINATARIOS:espectrumsuporte@gmail.com}
